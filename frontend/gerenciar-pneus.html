<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gerenciar Pneus Novos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fb;
        }
        .navbar {
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }
        .table-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            padding: 20px;
        }
        .page-title {
            font-weight: bold;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Sistema de Recapadora</span>
        <div class="d-flex flex-wrap gap-2">
            <a href="dashboard.html" class="btn btn-outline-light">Dashboard</a>
            <a href="bandas.html" id="menuBandas" class="btn btn-outline-light">Estoque</a>
            <a href="consulta-pneus.html" id="menuConsultaPneus" class="btn btn-outline-light">🛞 Pneus Novos (Online)</a>
            <a href="gerenciar-pneus.html" id="menuGerenciarPneus" class="btn btn-warning">⚙️ Gerenciar Pneus</a>
            <a href="producao.html" id="menuProducao" class="btn btn-outline-light">Produção</a>
            <a href="compras.html" id="menuCompras" class="btn btn-outline-light">📦 Compras (XML)</a>
            <button onclick="logout()" class="btn btn-danger">Sair</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="page-title text-dark">⚙️ Gerenciamento de Pneus Novos</h2>

    <div class="table-card mb-4">
        <h5 class="card-title fw-bold text-secondary mb-3">Cadastrar Novo Pneu no Catálogo</h5>
        <form id="formCadastro" class="row g-3 align-items-end">
            <div class="col-12 col-md-4">
                <label class="form-label fw-bold">Medida</label>
                <input type="text" id="medida" class="form-control" placeholder="Ex: 295/80R22.5" required>
            </div>
            <div class="col-12 col-md-4">
                <label class="form-label fw-bold">Marca / Modelo</label>
                <input type="text" id="marca_modelo" class="form-control" placeholder="Ex: CONTINENTAL - HSR2" required>
            </div>
            <div class="col-12 col-md-2">
                <label class="form-label fw-bold">Qtd Inicial</label>
                <input type="number" id="quantidade" class="form-control" value="0" min="0">
            </div>
            <div class="col-12 col-md-2">
                <button type="submit" class="btn btn-primary w-100 fw-bold">Salvar Pneu</button>
            </div>
        </form>
    </div>

    <div class="table-card">
        <h5 class="card-title fw-bold text-secondary mb-3">Itens no Sistema (Entradas e Saídas)</h5>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-dark">
                    <tr>
                        <th>Medida</th>
                        <th>Marca / Modelo</th>
                        <th class="text-center" style="width: 220px;">Quantidade Disponível</th>
                        <th class="text-center" style="width: 120px;">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoGerenciamento">
                    </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const perfil = localStorage.getItem('perfil');

    // Segurança Bloqueia Vendedor e Produção de alterarem estoque de Pneus Novos
    if (perfil === 'VENDEDOR' || perfil === 'PRODUCAO') {
        window.location.href = 'dashboard.html';
    }

    async function carregarPneus() {
        try {
            const response = await fetch('/api/pneus-novos');
            const pneus = await response.json();
            
            const corpo = document.getElementById('corpoGerenciamento');
            corpo.innerHTML = '';

            pneus.forEach(pneu => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><span class="fw-bold text-dark">${pneu.medida}</span></td>
                    <td>${pneu.marca_modelo}</td>
                    <td class="text-center">
                        <div class="input-group input-group-sm justify-content-center">
                            <input type="number" class="form-control text-center fw-bold" id="qtd-${pneu.id}" value="${pneu.quantidade_disponivel}" min="0" style="max-width: 80px;">
                            <button class="btn btn-success fw-bold" onclick="atualizarEstoque(${pneu.id})">Atualizar</button>
                        </div>
                    </td>
                    <td class="text-center">
                        <button class="btn btn-sm btn-danger" onclick="excluirPneu(${pneu.id})">Excluir</button>
                    </td>
                `;
                corpo.appendChild(tr);
            });
        } catch (error) {
            console.error('Erro ao buscar dados:', error);
        }
    }

    document.getElementById('formCadastro').addEventListener('submit', async (e) => {
        e.preventDefault();
        const dados = {
            medida: document.getElementById('medida').value,
            marca_modelo: document.getElementById('marca_modelo').value,
            quantidade_disponivel: document.getElementById('quantidade').value
        };

        try {
            const response = await fetch('/api/pneus-novos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (response.ok) {
                document.getElementById('formCadastro').reset();
                carregarPneus();
            } else {
                alert('Erro ao cadastrar.');
            }
        } catch (error) {
            alert('Erro de conexão.');
        }
    });

    async function atualizarEstoque(id) {
        const novaQtd = document.getElementById(`qtd-${id}`).value;
        try {
            const response = await fetch(`/api/pneus-novos/${id}/estoque`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ quantidade: novaQtd })
            });
            if (response.ok) carregarPneus();
        } catch (error) {
            alert('Erro ao atualizar.');
        }
    }

    async function excluirPneu(id) {
        if (!confirm('Deseja remover este pneu?')) return;
        try {
            const response = await fetch(`/api/pneus-novos/${id}`, { method: 'DELETE' });
            if (response.ok) carregarPneus();
        } catch (error) {
            alert('Erro ao remover.');
        }
    }

    function logout(){
        localStorage.clear();
        window.location.href = 'login.html';
    }

    carregarPneus();
</script>
</body>
</html>
