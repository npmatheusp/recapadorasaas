<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recapadora SaaS - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f7fb;
        }
        /* Card moderno com bordas suaves e sombra elegante */
        .login-card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            background: #ffffff;
        }
        /* Estilização sutil dos inputs focados */
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        }
    </style>
</head>
<body>

<div class="container min-vh-100 d-flex align-items-center justify-content-center">
    
    <div class="col-11 col-sm-8 col-md-6 col-lg-4">
        
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark mb-1">Sistema Recapadora</h2>
            <p class="text-secondary small">Insira suas credenciais para acessar</p>
        </div>

        <div class="card login-card p-4">
            <div class="card-body p-2">
                <form onsubmit="event.preventDefault(); login();">
                    
                    <div class="mb-3">
                        <label for="usuario" class="form-label fw-bold text-secondary small">Usuário</label>
                        <input 
                            type="text" 
                            id="usuario" 
                            class="form-control form-control-lg fs-6" 
                            placeholder="Digite seu usuário" 
                            required 
                            autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label fw-bold text-secondary small">Senha</label>
                        <input 
                            type="password" 
                            id="senha" 
                            class="form-control form-control-lg fs-6" 
                            placeholder="Digite sua senha" 
                            required 
                            autocomplete="current-password">
                    </div>

                    <button 
                        type="submit" 
                        class="btn btn-primary btn-lg w-100 fw-bold fs-6 py-2.5">
                        Entrar no Sistema
                    </button>

                </form>
            </div>
        </div>

        <div class="text-center mt-4">
            <p class="text-muted small">&copy; 2026 Recapadora SaaS. Todos os direitos reservados.</p>
        </div>

    </div>
</div>

<script src="js/auth.js"></script>
<script src="js/config.js"></script>

</body>
</html>
