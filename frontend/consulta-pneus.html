<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Estoque Online - Pneus Novos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: #f5f7fb;
        }
        .navbar {
            box-shadow: 0 2px 10px rgba(0,0,0,.1);
        }
        .table-card {
            background: #fff;
            border-radius: 15px;
            box-shadow: 0 2px 10px rgba(0,0,0,.08);
            padding: 20px;
        }
        .page-title {
            font-weight: bold;
            margin-bottom: 25px;
        }
        .badge-qtd {
            font-size: 14px;
            font-weight: bold;
            padding: 6px 12px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand">Sistema de Recapadora</span>
        <div class="d-flex flex-wrap gap-2">
            <a href="dashboard.html" class="btn btn-outline-light">Dashboard</a>
            <a href="bandas.html" id="menuBandas" class="btn btn-outline-light">Estoque</a>
            
            <a href="consulta-pneus.html" id="menuConsultaPneus" class="btn btn-warning d-inline-flex align-items-center gap-2">
                <i class="bi bi-disc-fill"></i> Estoque Pneus Novos
            </a>
            
            <a href="gerenciar-pneus.html" id="menuGerenciarPneus" class="btn btn-outline-light d-inline-flex align-items-center gap-2">
                <i class="bi bi-gear-fill"></i> Gerenciar Pneus
            </a>
            
            <a href="producao.html" id="menuProducao" class="btn btn-outline-light">Produção</a>
            
            <a href="compras.html" id="menuCompras" class="btn btn-outline-light d-inline-flex align-items-center gap-2">
                <i class="bi bi-box-seam-fill"></i> Compras (XML)
            </a>
            
            <button onclick="logout()" class="btn btn-danger">Sair</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2 class="page-title text-dark d-inline-flex align-items-center gap-2">
        <i class="bi bi-disc-fill text-secondary"></i> Estoque Online de Pneus Novos
    </h2>

    <div class="table-card">
        <div class="mb-4">
            <label for="inputBusca" class="form-label fw-bold text-secondary">Filtrar Pneus</label>
            <input type="text" id="inputBusca" class="form-control form-control-lg" placeholder="Digite a medida, marca ou modelo para buscar na hora...">
        </div>

        <div id="loading" class="text-center my-4">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="text-muted mt-2">Consultando estoque em tempo real...</p>
        </div>

        <div class="table-responsive">
            <table id="tabelaPneus" class="table table-striped table-hover align-middle" style="display: none;">
                <thead class="table-dark">
                    <tr>
                        <th>Medida</th>
                        <th>Marca / Modelo</th>
                        <th class="text-center" style="width: 150px;">Disponível em Estoque</th>
                    </tr>
                </thead>
                <tbody id="corpoTabela">
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const perfil = localStorage.getItem('perfil');
    let todosOsPneus = [];

    // Trava de Segurança por Perfil
    if (perfil === 'PRODUCAO') {
        window.location.href = 'dashboard.html';
    }

    // Controle do Menu Superior
    if (perfil === 'VENDEDOR') {
        if (document.getElementById('menuProducao')) document.getElementById('menuProducao').style.display = 'none';
        if (document.getElementById('menuCompras')) document.getElementById('menuCompras').style.display = 'none'; 
        if (document.getElementById('menuGerenciarPneus')) document.getElementById('menuGerenciarPneus').style.display = 'none'; 
    }

    async function carregarEstoque() {
        try {
            const response = await fetch('/api/pneus-novos/online');
            if (!response.ok) throw new Error();
            todosOsPneus = await response.json();
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('tabelaPneus').style.display = 'table';
            renderizarTabela(todosOsPneus);
        } catch (error) {
            document.getElementById('loading').innerHTML = `<p class="text-danger fw-bold">Erro ao conectar com o servidor.</p>`;
        }
    }

    function renderizarTabela(lista) {
        const corpo = document.getElementById('corpoTabela');
        corpo.innerHTML = '';

        if(lista.length === 0) {
            corpo.innerHTML = `<tr><td colspan="3" class="text-center text-muted py-3">Nenhum pneu disponível em estoque no momento.</td></tr>`;
            return;
        }

        lista.forEach(pneu => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><span class="fw-bold text-primary">${pneu.medida}</span></td>
                <td>${pneu.marca_modelo}</td>
                <td class="text-center">
                    <span class="badge bg-success badge-qtd">${pneu.quantidade_disponivel} UN</span>
                </td>
            `;
            corpo.appendChild(tr);
        });
    }

    document.getElementById('inputBusca').addEventListener('input', (e) => {
        const termo = e.target.value.toLowerCase().trim();
        const filtrados = todosOsPneus.filter(pneu => 
            pneu.medida.toLowerCase().includes(termo) || pneu.marca_modelo.toLowerCase().includes(termo)
        );
        renderizarTabela(filtrados);
    });

    function logout(){
        localStorage.clear();
        window.location.href = 'login.html';
    }

    carregarEstoque();
</script>
</body>
</html>
