<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrada de Estoque - XML</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f5f7fb; }
        
        /* 🎨 Neutraliza e força o padrão exato da barra do Dashboard */
        .navbar {
            box-shadow: 0 2px 10px rgba(0,0,0,.1) !important;
        }
        .navbar .btn {
            min-height: auto !important;
            border-radius: 4px !important;
            width: auto !important;
            margin-bottom: 0 !important;
        }

        .card { border: none; border-radius: 15px; }
        .card-header { border-radius: 15px 15px 0 0 !important; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fs-5">
            Sistema de Recapadora
        </span>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end mt-2 mt-lg-0" id="navbarNav">
            <div class="navbar-nav gap-2 w-100 justify-content-start justify-content-lg-end">
                <a href="dashboard.html" class="btn btn-sm btn-outline-light">
                    Dashboard
                </a>
                
                <a href="compras.html" id="menuCompras" class="btn btn-sm btn-warning fw-bold">
                    📦 Compras (XML)
                </a>
                
                <button onclick="logout()" class="btn btn-sm btn-danger">
                    Sair
                </button>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="card shadow-sm col-md-6 mx-auto">
        <div class="card-header bg-success text-white">
            <h5 class="mb-0">Importar NF-e (.xml)</h5>
        </div>
        <div class="card-body">
            <p class="text-muted small">
                Selecione o arquivo XML da nota fiscal do fornecedor. O sistema lerá os itens e adicionará as quantidades diretamente ao estoque se o <strong>Código do Produto</strong> na nota coincidir com o <strong>Código</strong> cadastrado no sistema.
            </p>
            
            <form id="formImportarXml">
                <div class="mb-4">
                    <label for="xmlNota" class="form-label fw-bold">Arquivo XML da Nota</label>
                    <input class="form-control" type="file" id="xmlNota" accept=".xml" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100 py-2">
                    Importar XML da Nota
                </button>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/config.js"></script>
<script src="js/compras.js"></script>
</body>
</html>
