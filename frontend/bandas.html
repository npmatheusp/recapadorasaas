<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estoque de Bandas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1 fs-5">
            Sistema de Recapadora
        </span>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse justify-content-end mt-2 mt-lg-0" id="navbarNav">
            <div class="navbar-nav gap-2 w-100 justify-content-start justify-content-lg-end">
                <a href="dashboard.html" class="btn btn-sm btn-outline-light">
                    Dashboard
                </a>

                <a href="bandas.html" id="menuBandas" class="btn btn-sm btn-warning fw-bold">
                    Estoque Borracha
                </a>

                <button class="btn btn-sm btn-danger mt-2 mt-lg-0" onclick="gerarPdfEstoque()">
                    Gerar PDF do Estoque
                </button>

                <button onclick="logout()" class="btn btn-sm btn-danger mt-2 mt-lg-0">
                    Sair
                </button>
            </div>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div id="formCadastroBandas" class="card p-3 mb-4">
        <h5 class="mb-3">Nova Banda</h5>
        <div class="row g-2">
            <div class="col-12 col-md-3">
                <input id="codigo" class="form-control" placeholder="Código Fornecedor (XML)">
            </div>

            <div class="col-12 col-md-3">
                <input id="descricao" class="form-control" placeholder="Descrição / Nome comercial">
            </div>

            <div class="col-6 col-md-2">
                <input id="estoque_total" type="number" class="form-control" placeholder="Estoque Inicial">
            </div>

            <div class="col-6 col-md-2">
                <input id="estoque_minimo" type="number" class="form-control" placeholder="Qtd Mínima">
            </div>

            <div class="col-12 col-md-2">
                <button onclick="salvarBanda()" class="btn btn-primary w-100">
                    Salvar
                </button>
            </div>
        </div>
    </div>

    <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="mb-0">Estoque de Bandas</h5>
            <span class="badge bg-secondary">Consulta de Estoque</span>
        </div>

        <div class="mb-3">
            <input
                type="text"
                id="filtroBanda"
                class="form-control"
                placeholder="Buscar por código ou descrição..."
                onkeyup="filtrarBandas()"
            >
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>Código</th>
                        <th>Descrição</th>
                        <th>Estoque</th>
                        <th>Estoque Mínimo</th>
                        <th>Status</th>
                        <th width="180" id="colunaAcoesBanda">Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaBandas">
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    // 🛡️ Trava visual isolada para manter a proporção e esconder recursos do Vendedor
    (function() {
        const p = localStorage.getItem('perfil');
        if (p === 'VENDEDOR') {
            const style = document.createElement('style');
            style.innerHTML = '#formCadastroBandas, #colunaAcoesBanda, .btn-acao-tabela { display: none !important; }';
            document.head.appendChild(style);
        }
    })();
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/permissoes.js"></script>
<script src="js/config.js"></script>
<script src="js/bandas.js"></script>

</body>
</html>
